
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON FIGHTERS 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070914;color:white;font-family:Arial,sans-serif;overflow:hidden}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:16px}
.top{text-align:center}
.logo{font-weight:1000;font-size:clamp(22px,4vw,38px);letter-spacing:4px;text-shadow:0 0 22px #16cfff}
.logo span{color:#ff4c91}
.subtitle{font-size:10px;letter-spacing:4px;color:#a4b8dd;margin-top:5px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}
.playerhud{width:43%;max-width:430px}
.name{font-size:12px;letter-spacing:2px;font-weight:bold;margin-bottom:7px}
.bar{height:19px;background:#1b2037;border:2px solid #8797c9;transform:skewX(-10deg);overflow:hidden}
.fill{height:100%;width:100%;transition:width .15s;background:linear-gradient(90deg,#19f0c0,#a0ffce)}
.enemyfill{background:linear-gradient(90deg,#ffb64e,#ff397f)}
#timer{font-size:30px;font-weight:1000;text-shadow:0 0 15px #64d9ff}
#message{position:absolute;left:0;right:0;top:37%;text-align:center;font-size:clamp(25px,5vw,58px);font-weight:1000;letter-spacing:3px;text-shadow:0 4px 20px #000;opacity:0;transition:opacity .2s}
#message.show{opacity:1}
.bottom{display:flex;justify-content:space-between;align-items:end;gap:12px}
.help{font-size:11px;color:#c1cce4;line-height:1.8;text-shadow:0 2px 5px black}
button{pointer-events:auto;border:1px solid #5b83be;background:#172343;color:white;font-weight:bold;border-radius:12px;padding:13px 17px;cursor:pointer;touch-action:none}
#start{background:linear-gradient(120deg,#27edc1,#2e9dff);color:#06101e;border:0;font-size:15px}
.controls{pointer-events:auto;display:flex;gap:7px;align-items:end}
.controls button{width:51px;height:53px;padding:0;font-size:21px;user-select:none}
.controls .attack{background:#48264f;border-color:#ff5f9b}
.controls .special{background:#17495d;border-color:#3ae7fa}
.controls .block{background:#303c5e}
@media(min-width:750px){
 .controls{position:absolute;bottom:22px;right:22px}
 .help{max-width:420px}
}
@media(max-width:749px){
 #ui{padding:10px}
 .hud{margin-top:12px}
 .name{font-size:10px}
 .bar{height:14px}
 #timer{font-size:23px}
 .bottom{align-items:end}
 .help{max-width:43%;font-size:9px}
 .controls{display:grid;grid-template-columns:repeat(3,43px);gap:5px}
 .controls button{width:43px;height:45px;font-size:17px}
 #start{padding:10px;font-size:12px}
}
</style>
</head>
<body>
<div id="game"></div>
<div id="ui">
 <div class="top">
  <div class="logo">NEON <span>FIGHTERS</span></div>
  <div class="subtitle">3D ARCADE COMBAT</div>
  <div class="hud">
   <div class="playerhud">
    <div class="name">PLAYER 01 · CYBER</div>
    <div class="bar"><div class="fill" id="hp1"></div></div>
   </div>
   <div id="timer">99</div>
   <div class="playerhud" style="text-align:right">
    <div class="name">CPU · TITAN</div>
    <div class="bar"><div class="fill enemyfill" id="hp2"></div></div>
   </div>
  </div>
 </div>
 <div id="message">ROUND 1</div>
 <div class="bottom">
  <div>
   <button id="start">▶ EMPEZAR COMBATE</button>
   <div class="help">
    A / D: MOVER · W: SALTAR<br>
    J: PUÑETAZO · K: PATADA · L: ESPECIAL<br>
    S: BLOQUEAR
   </div>
  </div>
  <div class="controls">
   <button id="left" aria-label="Mover izquierda">◀</button>
   <button id="right" aria-label="Mover derecha">▶</button>
   <button class="block" id="block">🛡</button>
   <button class="attack" id="punch">👊</button>
   <button class="attack" id="kick">🦵</button>
   <button class="special" id="special">⚡</button>
   <button id="jump">⬆</button>
  </div>
 </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const root=document.getElementById('game');
const scene=new THREE.Scene();
scene.background=new THREE.Color('#080d20');
scene.fog=new THREE.Fog('#080d20',17,38);

const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);
camera.position.set(0,6.5,15.8);
camera.lookAt(0,2,0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.35;
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x8ccaff,0x21132e,2.1));
const keyLight=new THREE.DirectionalLight(0xffffff,3);
keyLight.position.set(-4,9,7);
keyLight.castShadow=true;
keyLight.shadow.mapSize.set(1024,1024);
scene.add(keyLight);

function glow(color,intensity=2){
 const l=new THREE.PointLight(color,intensity,12);
 return l;
}
const blueLight=glow(0x168bff,30);
blueLight.position.set(-5,3,1);scene.add(blueLight);
const pinkLight=glow(0xff197d,30);
pinkLight.position.set(5,3,-1);scene.add(pinkLight);

function mat(color,metalness=0,roughness=.5,emissive=0x000000){
 return new THREE.MeshStandardMaterial({color,metalness,roughness,emissive,emissiveIntensity:.65});
}
const floorMat=mat('#151d39',.55,.35);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(36,26),floorMat);
floor.rotation.x=-Math.PI/2;floor.position.y=-.08;
floor.receiveShadow=true;scene.add(floor);

const grid=new THREE.GridHelper(36,36,0x3287d8,0x273354);
grid.position.y=-.055;scene.add(grid);

function box(w,h,d,material,x=0,y=0,z=0){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
 return m;
}

// Neon arena rails and columns
for(let i=0;i<2;i++){
 const z=i===0?-4:4;
 const rail=box(23,.08,.08,mat(i===0?'#ff268f':'#19caff',.2,.3,i===0?0xff147b:0x008cff),0,.03,z);
 scene.add(rail);
}
for(const x of [-10,10]){
 const pillar=box(.18,4,.18,mat('#202d50',.4,.4),x,2,-3);
 scene.add(pillar);
 const lamp=box(.24,.1,.24,mat('#26cfff',.2,.2,0x00aaff),x,3.5,-3);
 scene.add(lamp);
}
const wall=box(24,6,.5,mat('#101932',.3,.6),0,3,-5);
scene.add(wall);

// Futuristic background lights
for(let i=0;i<13;i++){
 const x=-10+i*1.65;
 const panel=box(.85,1.9,.06,mat(i%2?'#35204c':'#163f60',.25,.5,i%2?0x8a1368:0x056d9e),x,2,-4.72);
 scene.add(panel);
}
const sign=box(4,.65,.1,mat('#142d4e',.3,.3,0x0d7bff),0,4.9,-4.6);
scene.add(sign);

// Fighters built from articulated 3D parts
function makeFighter(name,primary,secondary,accent){
 const group=new THREE.Group();
 const main=mat(primary,.28,.32);
 const trim=mat(secondary,.35,.27);
 const skin=mat('#dba887',.05,.65);
 const dark=mat('#10162c',.35,.3);
 const glowmat=mat(accent,.2,.2,accent);
 const torso=new THREE.Group();torso.position.y=1.25;group.add(torso);
 torso.add(box(.7,.85,.43,main,0,0,0));
 torso.add(box(.72,.16,.45,trim,0,.2,.015));
 torso.add(box(.48,.14,.46,dark,0,-.32,0));
 const head=new THREE.Group();head.position.set(0,.65,0);torso.add(head);
 head.add(box(.43,.48,.4,skin,0,.05,0));
 head.add(box(.46,.14,.43,dark,0,.29,0));
 head.add(box(.28,.055,.035,glowmat,0,.08,.219));
 head.add(box(.16,.07,.07,skin,0,-.12,.2));
 // neck
 torso.add(box(.23,.16,.22,skin,0,.45,0));
 const limbs={};
 function limb(key,material,length,radius){
  const pivot=new THREE.Group();
  const segment=box(radius,length,radius,material,0,-length/2,0);
  pivot.add(segment);
  group.add(pivot);limbs[key]=pivot;
  return pivot;
 }
 limbs.la=limb('la',trim,.55,.2);
 limbs.ra=limb('ra',main,.55,.2);
 limbs.ll=limb('ll',dark,.65,.25);
 limbs.rl=limb('rl',dark,.65,.25);
 limbs.la.position.set(-.47,1.52,0);
 limbs.ra.position.set(.47,1.52,0);
 limbs.ll.position.set(-.23,.85,0);
 limbs.rl.position.set(.23,.85,0);
 // gloves
 for(const side of [-1,1]){
  const glove=box(.27,.22,.3,glowmat,side*.47,-.5,.015);
  (side<0?limbs.la:limbs.ra).add(glove);
 }
 // boots
 for(const leg of [limbs.ll,limbs.rl]){
  leg.add(box(.3,.17,.42,trim,0,-.58,.08));
 }
 const belt=box(.68,.14,.46,glowmat,0,1.02,0);
 group.add(belt);
 group.userData={name,torso,head,limbs,primary,accent,baseY:0,
  hp:100,action:'idle',actionTime:0,attackHit:false,
  cooldown:0,blocking:false,jump:0,velocity:0,stun:0,
  walk:0,side:1};
 scene.add(group);
 group.position.y=0;
 return group;
}

const player=makeFighter('CYBER','#1765ce','#132347','#31eaff');
const enemy=makeFighter('TITAN','#b82e60','#44213c','#ff4798');
player.position.set(-2.7,0,.4);
enemy.position.set(2.7,0,-.3);
player.rotation.y=.25;
enemy.rotation.y=-.25;

function makeRing(x,z,r,color){
 const ring=new THREE.Mesh(new THREE.TorusGeometry(r,.025,8,50),
  mat(color,.25,.3,color));
 ring.rotation.x=Math.PI/2;
 ring.position.set(x,.02,z);scene.add(ring);
 return ring;
}
const rings=[makeRing(-2.7,.4,.65,0x12bfff),makeRing(2.7,-.3,.65,0xff258d)];

let running=false,gameOver=false,remaining=99,last=performance.now();
let moveL=false,moveR=false,block=false;
let particles=[],effects=[],shake=0;
const $=id=>document.getElementById(id);
const message=$('message');
function announce(text){
 message.textContent=text;message.classList.add('show');
 clearTimeout(announce.timeout);
 announce.timeout=setTimeout(()=>message.classList.remove('show'),1000);
}
function updateBars(){
 $('hp1').style.width=Math.max(0,player.userData.hp)+'%';
 $('hp2').style.width=Math.max(0,enemy.userData.hp)+'%';
}
function reset(){
 for(const f of [player,enemy]){
  f.userData.hp=100;f.userData.action='idle';
  f.userData.actionTime=0;f.userData.cooldown=0;
  f.userData.stun=0;f.userData.jump=0;f.userData.velocity=0;
  f.position.y=0;
 }
 player.position.x=-2.7;enemy.position.x=2.7;
 player.position.z=.4;enemy.position.z=-.3;
 remaining=99;gameOver=false;running=true;
 $('timer').textContent='99';updateBars();
 announce('FIGHT!');
}
$('start').onclick=()=>{reset();$('start').textContent='↻ REINICIAR';};

function attack(f,type){
 if(!running||f.userData.cooldown>0||f.userData.stun>0)return;
 const u=f.userData;
 u.action=type;u.actionTime=0;u.attackHit=false;
 u.cooldown=type==='special'?1.1:type==='kick'?.65:.38;
 if(type==='special'){
  const color=f===player?0x2cefff:0xff369e;
  const orb=new THREE.Mesh(new THREE.IcosahedronGeometry(.25,1),
   new THREE.MeshBasicMaterial({color}));
  orb.position.set(f.position.x+f.userData.side*.8,1.65, f.position.z);
  orb.userData={vx:f.userData.side*.24,owner:f,life:45,color};
  scene.add(orb);effects.push(orb);
  const light=glow(color,4);orb.add(light);
 }
}
function burst(x,y,z,color){
 for(let i=0;i<14;i++){
  const mesh=new THREE.Mesh(new THREE.IcosahedronGeometry(.045+Math.random()*.06,0),
   new THREE.MeshBasicMaterial({color,transparent:true}));
  mesh.position.set(x,y,z);
  mesh.userData={vx:(Math.random()-.5)*.18,vy:Math.random()*.2,vz:(Math.random()-.5)*.15,life:25};
  scene.add(mesh);particles.push(mesh);
 }
}
function damage(target,source,amount){
 if(target.userData.blocking){
  amount*=.16;
  burst(target.position.x,1.6,target.position.z,0x54eaff);
 }else{
  target.userData.stun=.2;
  target.userData.action='hit';target.userData.actionTime=0;
  target.position.x+=source.userData.side*.2;
  burst(target.position.x,1.6,target.position.z,source===player?0x36eaff:0xff368d);
  shake=5;
 }
 target.userData.hp=Math.max(0,target.userData.hp-amount);
 updateBars();
 if(target.userData.hp<=0){
  running=false;gameOver=true;
  announce(target===enemy?'VICTORIA':'DERROTA');
  $('start').textContent='▶ VOLVER A JUGAR';
 }
}

function fighterUpdate(f,opponent,dt,isPlayer){
 const u=f.userData,ou=opponent.userData;
 u.cooldown=Math.max(0,u.cooldown-dt);
 u.stun=Math.max(0,u.stun-dt);
 u.actionTime+=dt;
 u.blocking=isPlayer?block:false;
 if(u.action==='hit'&&u.actionTime>.23)u.action='idle';
 if(u.action==='punch'&&u.actionTime>.32)u.action='idle';
 if(u.action==='kick'&&u.actionTime>.46)u.action='idle';
 if(u.action==='special'&&u.actionTime>.5)u.action='idle';

 const dx=opponent.position.x-f.position.x;
 u.side=dx>=0?1:-1;
 f.rotation.y=u.side>0?Math.PI/2:-Math.PI/2;

 if(isPlayer){
  if(u.stun<=0){
   if(moveL)f.position.x-=3.4*dt;
   if(moveR)f.position.x+=3.4*dt;
   if(u.jump>0){
    u.velocity-=18*dt;f.position.y+=u.velocity*dt;
    if(f.position.y<=0){f.position.y=0;u.jump=0;u.velocity=0;}
   }
  }
 }else if(running&&u.stun<=0){
  const distance=Math.abs(dx);
  if(distance>1.6){
   f.position.x+=Math.sign(dx)*1.75*dt;
  }else if(u.cooldown<=0&&Math.random()<dt*.9){
   attack(f,Math.random()<.25?'kick':'punch');
  }
  u.blocking=ou.action==='punch'||ou.action==='kick';
 }
 f.position.x=THREE.MathUtils.clamp(f.position.x,-7,7);
 if(f.position.y<0)f.position.y=0;

 // Smooth animated body and limbs
 const moving=isPlayer?(moveL||moveR):(Math.abs(dx)>1.6);
 u.walk+=dt*(moving?12:3);
 const swing=moving?Math.sin(u.walk)*.65:0;
 const a=u.actionTime;
 let punch=0,kick=0;
 if(u.action==='punch')punch=Math.sin(Math.min(1,a/.24)*Math.PI);
 if(u.action==='kick')kick=Math.sin(Math.min(1,a/.32)*Math.PI);
 const guard=u.blocking?-.7:0;
 u.limbs.la.rotation.z=guard+swing*.65-punch*.9;
 u.limbs.ra.rotation.z=guard-swing*.65-punch*.2;
 u.limbs.ll.rotation.z=swing*.7-kick*1.3;
 u.limbs.rl.rotation.z=-swing*.7+kick*.3;
 u.torso.rotation.z=(u.action==='hit'?.2:0)+Math.sin(u.walk)*.035;
 u.head.rotation.z=Math.sin(u.walk)*.025;

 // Hit detection during the active part of the attack
 if((u.action==='punch'||u.action==='kick')&&!u.attackHit&&a>.1&&a<.3){
  if(Math.abs(dx)<1.65&&Math.abs(f.position.z-opponent.position.z)<1.4&&
    Math.abs(f.position.y-opponent.position.y)<1.3){
   u.attackHit=true;
   damage(opponent,f,u.action==='kick'?11:7);
  }
 }
}

function updateEffects(dt){
 for(const orb of [...effects]){
  orb.position.x+=orb.userData.vx;
  orb.userData.life--;
  const owner=orb.userData.owner;
  const target=owner===player?enemy:player;
  if(Math.abs(orb.position.x-target.position.x)<.55&&
     Math.abs(orb.position.y-1.65)<.7){
   damage(target,owner,16);
   scene.remove(orb);effects.splice(effects.indexOf(orb),1);continue;
  }
  if(orb.userData.life<=0||Math.abs(orb.position.x)>10){
   scene.remove(orb);effects.splice(effects.indexOf(orb),1);
  }
 }
 for(const p of [...particles]){
  p.position.x+=p.userData.vx;
  p.position.y+=p.userData.vy;
  p.position.z+=p.userData.vz;
  p.userData.vy-=.009;p.userData.life--;
  p.scale.multiplyScalar(.97);
  if(p.userData.life<=0){
   scene.remove(p);particles.splice(particles.indexOf(p),1);
  }
 }
}
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);last=now;
 if(running){
  remaining-=dt;
  if(remaining<=0){
   remaining=0;running=false;gameOver=true;
   announce(player.userData.hp>=enemy.userData.hp?'TIEMPO · VICTORIA':'TIEMPO · DERROTA');
   $('start').textContent='▶ VOLVER A JUGAR';
  }
  $('timer').textContent=Math.ceil(remaining);
  fighterUpdate(player,enemy,dt,true);
  fighterUpdate(enemy,player,dt,false);
  if(Math.abs(player.position.x-enemy.position.x)<1.05){
   const mid=(player.position.x+enemy.position.x)/2;
   player.position.x=mid-Math.sign(enemy.position.x-player.position.x)*.53;
   enemy.position.x=mid+Math.sign(enemy.position.x-player.position.x)*.53;
  }
  rings[0].position.x=player.position.x;rings[0].position.z=player.position.z;
  rings[1].position.x=enemy.position.x;rings[1].position.z=enemy.position.z;
 }
 updateEffects(dt);
 const center=(player.position.x+enemy.position.x)/2;
 camera.position.x+=(center-camera.position.x)*Math.min(1,dt*3);
 camera.lookAt(center,1.8,0);
 if(shake>0){
  camera.position.y=6.5+(Math.random()-.5)*shake*.025;
  shake=Math.max(0,shake-dt*18);
 }else camera.position.y+=(6.5-camera.position.y)*.1;
 blueLight.position.x=player.position.x;
 pinkLight.position.x=enemy.position.x;
 renderer.render(scene,camera);
}
function bind(id,down,up){
 const el=$(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();down();});
 for(const ev of ['pointerup','pointercancel','pointerleave'])
  el.addEventListener(ev,e=>{up();});
}
bind('left',()=>moveL=true,()=>moveL=false);
bind('right',()=>moveR=true,()=>moveR=false);
bind('block',()=>block=true,()=>block=false);
bind('punch',()=>attack(player,'punch'),()=>{});
bind('kick',()=>attack(player,'kick'),()=>{});
bind('special',()=>attack(player,'special'),()=>{});
bind('jump',()=>{if(player.userData.jump===0){player.userData.jump=1;player.userData.velocity=7;}},()=>{});

document.addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(['arrowleft','arrowright','arrowup',' '].includes(k))e.preventDefault();
 if(k==='a'||k==='arrowleft')moveL=true;
 if(k==='d'||k==='arrowright')moveR=true;
 if(k==='s')block=true;
 if(k==='w'||k==='arrowup'||k===' ')if(player.userData.jump===0){player.userData.jump=1;player.userData.velocity=7;}
 if(!e.repeat&&k==='j')attack(player,'punch');
 if(!e.repeat&&k==='k')attack(player,'kick');
 if(!e.repeat&&k==='l')attack(player,'special');
});
document.addEventListener('keyup',e=>{
 const k=e.key.toLowerCase();
 if(k==='a'||k==='arrowleft')moveL=false;
 if(k==='d'||k==='arrowright')moveR=false;
 if(k==='s')block=false;
});
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
updateBars();
requestAnimationFrame(animate);
</script>
</body>
</html>
